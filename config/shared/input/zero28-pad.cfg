; MagicX Mini Zero 28 — its own button numbering
;
; Merged over default.cfg by launch.sh via the bundled `ini` merge, once per
; device. Only the keys below are replaced, so anything the user changes
; afterwards survives.
;
; Every other supported pad uses the TrimUI numbering default.cfg is written for.
; magicx-input numbers its buttons MinUI's way (workspace/zero28/platform/
; platform.h, confirmed on device): A=0 B=1 X=2 Y=3 L1=4 R1=5 L2=6 R2=7
; Select=8 Start=9 L3=10 R3=11, d-pad on buttons 13-16 (no hat), Menu=19. The
; sticks are axes 0/1 (left) and 2/3 (right), and L2/R2 are digital, so there
; are no trigger axes.
;
; Each binding keeps default.cfg's physical position: N64 A on A (right), N64 B
; on B (bottom), the right stick drives the C-buttons with X (top) and Y (left)
; as C-Left and C-Down, and Z is on either trigger.

[Input-SDL-Control1]
DPad R = "button(15)"
DPad L = "button(14)"
DPad D = "button(16)"
DPad U = "button(13)"
Start = "button(9)"
Z Trig = "button(6) button(7)"
B Button = "button(1)"
A Button = "button(0)"
C Button R = "axis(2+,24000)"
C Button L = "axis(2-,24000) button(2)"
C Button D = "axis(3+,24000) button(3)"
C Button U = "axis(3-,24000)"
Hotkey = "button(19)"
