; Anbernic H700 — left and right analog sticks
;
; Merged over default.cfg by launch.sh via the bundled `ini merge`, once per
; device. Only the keys below are replaced, so anything the user changes
; afterwards survives.
;
; SDL button indices for NextUI's h700 SDL2, which enumerates a pad's buttons in
; ascending evdev keycode order. The Anbernic pad reports ESC (1) and the two
; volume keys (114/115) first, so its gamepad buttons start at index 3:
;
;   A          button(3)
;   B          button(4)
;   Y          button(5)
;   X          button(6)
;   L1         button(7)
;   R1         button(8)
;   Select     button(9)
;   Start      button(10)
;   Menu       button(11)
;   L3         button(12)
;   L2         button(13)
;   R2         button(14)
;   R3         button(15)
;
; The d-pad is SDL hat 0 (ABS_HAT0X/Y). Left stick is axes 0/1 and drives the N64 analog stick;
; right stick is axes 2/3 and drives the C-buttons.
;

[Input-SDL-Control1]

DPad R = "hat(0 Right)"
DPad L = "hat(0 Left)"
DPad D = "hat(0 Down)"
DPad U = "hat(0 Up)"
Start = "button(10)"
Z Trig = "button(13)"
B Button = "button(4)"
A Button = "button(3)"
C Button R = "axis(2+,24000)"
C Button L = "axis(2-,24000)"
C Button D = "axis(3+,24000)"
C Button U = "axis(3-,24000)"
R Trig = "button(8)"
L Trig = "button(7)"
X Axis = "axis(0-,0+)"
Y Axis = "axis(1-,1+)"
