; Anbernic H700 — no analog sticks
;
; Merged over default.cfg by launch.sh via the bundled `ini merge`, once per
; device. Only the keys below are replaced, so anything the user changes
; afterwards survives.
;
; SDL button indices for NextUI's h700 SDL2, which enumerates a pad's buttons in
; ascending evdev keycode order. The Anbernic pad reports ESC (1) and the two
; volume keys (114/115) first, so its gamepad buttons start at index 3:
;
;   A          button(3)
;   B          button(4)
;   Y          button(5)
;   X          button(6)
;   L1         button(7)
;   R1         button(8)
;   Select     button(9)
;   Start      button(10)
;   Menu       button(11)
;   L2         button(12)
;   R2         button(13)
;
; The d-pad is SDL hat 0 (ABS_HAT0X/Y). With no sticks at all, the d-pad drives the N64 analog stick
; as well as the N64 d-pad, and C-buttons are R2 + a face button.
; Double-binding the d-pad is deliberate: nearly every N64 game reads
; one or the other, so binding both leaves neither dead. The Brick
; instead has trimui_inputd swap them at the kernel level, which h700
; has no equivalent of.
;

[Input-SDL-Control1]

DPad R = "hat(0 Right)"
DPad L = "hat(0 Left)"
DPad D = "hat(0 Down)"
DPad U = "hat(0 Up)"
Start = "button(10)"
Z Trig = "button(12)"
B Button = "button(4)"
A Button = "button(3)"
C Button U = "button(6)"
C Button U_mod = 13
C Button D = "button(4)"
C Button D_mod = 13
C Button L = "button(5)"
C Button L_mod = 13
C Button R = "button(3)"
C Button R_mod = 13
R Trig = "button(8)"
L Trig = "button(7)"
X Axis = "hat(0 Left Right)"
Y Axis = "hat(0 Up Down)"
